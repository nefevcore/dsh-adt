# @nefevcore/abap-adt-dsh-plugin bundle patch.
#
# Installed into a dsh profile as a bundle layer: registers the ABAP ADT
# plugin, which exposes the `adt_*` tool family to the agent.
#
# Config resolution (nearest wins; see README 配置分层):
#   1. schema defaults (demo mode on, port 8123, no destinations)
#   2. inline `config:` of the plugin row (this file / a same-id row in the
#      profile's own cordis.patch.yml / an agent preset's agent.cordis.yml)
#      — the DSH settings composition base
#   3. legacy `${DSH_HOME:-~/.dsh}/abap-adt.yml` when it exists (deprecated;
#      warns; contents belong in the settings user section now)
#   4. settings user section — `abap-adt:` in ~/.dsh/settings.yaml (hot reload)
#   5. explicit `configFile` key from any layer (team-shared, authoritative)
#   6. SAP_* environment variables (permission policy only)
#
# The plugin registers its schema as the `abap-adt` settings namespace, so
# editing the settings.yaml section hot-applies without restarting DSH.
#
# Passwords are read from config or environment variables
# (ADT_<DESTINATION_NAME>_PASSWORD / ADT_PASSWORD), never stored in
# this file.
#
# Permission policy (权限管控) — optional keys, resolved as
# config > SAP_* env var > default (see src/policy.ts for semantics):
#   enableTransports        (SAP_ENABLE_TRANSPORTS)          default true
#   allowedTransports       (SAP_ALLOWED_TRANSPORTS)         default '*'
#   allowTransportableEdits (SAP_ALLOW_TRANSPORTABLE_EDITS)  default true
#   allowedPackages         (SAP_ALLOWED_PACKAGES)           default '*'
# Example lockdown: enableTransports: true, allowedTransports: 'D01K96*',
# allowTransportableEdits: true, allowedPackages: 'Z*,$TMP'.
#
# `demo: true` starts an in-process mock ADT server ("demo" destination) so
# the tool family works end-to-end without any SAP system. To disable it,
# override this row (same id) with `demo: false` — or set `demo: false` in
# ${DSH_HOME:-~/.dsh}/abap-adt.yml, which wins whenever this row leaves the
# key unset.

- insert:
    - id: abap-adt
      name: '@nefevcore/abap-adt-dsh-plugin'
      config:
        demo: true
